capture:
  interface: lo
  promiscuous: true

rules:
  arp_spoof:
    enabled: true
  port_scan:
    enabled: true
    threshold: 15
    window_seconds: 10
  syn_flood:
    enabled: true
    threshold: 100
    min_completion_ratio: 0.2
    window_seconds: 10

alerts:
  console: true

logging:
  path: logs/alerts.log